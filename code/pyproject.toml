[project]
name = "conformal-marl"
version = "0.0.0"
description = "Conformal Replay for Off-Policy Multi-Agent RL (JAX / JaxMARL implementation)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jaxmarl",
    "jax[cpu]",
    "flax",
    "optax",
    "flashbax",
    "chex",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conformal_marl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
